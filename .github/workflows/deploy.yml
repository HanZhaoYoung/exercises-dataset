name: 构建推送部署

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # ACR 个人版专属实例域名（成都地域，用户账号 crpi-q1ks31uh0havhu7p）
  REGISTRY: crpi-q1ks31uh0havhu7p.cn-chengdu.personal.cr.aliyuncs.com
  IMAGE: crpi-q1ks31uh0havhu7p.cn-chengdu.personal.cr.aliyuncs.com/yhz0831/exercises-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录阿里云 ACR
        run: |
          echo "${{ secrets.ALIYUN_ACR_PASSWORD }}" | \
            docker login $REGISTRY \
            -u "${{ secrets.ALIYUN_ACR_USERNAME }}" --password-stdin

      - name: 构建并推送镜像（latest + commit sha）
        run: |
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: SSH 触发服务器部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 47.108.133.181
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 服务器已通过 docker login 保存凭据（/root/.docker/config.json），无需重复登录
            docker pull $IMAGE:latest
            docker rm -f exercises-api >/dev/null 2>&1 || true
            # 媒体（GIF/缩略图）由挂载卷提供，由本机 scp 维护，不入镜像
            docker run -d --name exercises-api -p 3000:3000 \
              -v /root/videos:/app/videos -v /root/images:/app/images \
              --restart unless-stopped $IMAGE:latest
            sleep 3
            if curl -sf http://127.0.0.1:3000/health | grep -q '"status": *"ok"'; then
              echo "✔ 部署成功: $IMAGE:latest"
            else
              echo "✗ 健康检查失败:"; docker logs --tail 20 exercises-api; exit 1
            fi
